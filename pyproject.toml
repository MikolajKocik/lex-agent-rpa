[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lex-agent-rpa"
version = "0.1.0"
description = "RPA based agentic system for autonomous management of archives and legal documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicolas", email = "mikolajkocik02@gmail.com" }
]

# pip install -e .
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "langchain>=0.1.0",
    "langchain-nvidia-ai-endpoints>=0.1.0",
    "langgraph>=0.0.30",
    "azure-storage-blob>=12.19.0",
    "deepagents>=0.7.21",
    "nemoguardrails>=0.24.1",
    "langdetect>=1.0.9",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "asyncpg>=0.32.0",
    "azure-identity>=1.26.0",
    "azure-keyvault-secrets>=4.11.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
[tool.hatch.build.targets.wheel]
packages = ["src"]

