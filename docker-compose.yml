services:
  api:
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./src
        target: /app
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://lex_user:${POSTGRES_PASSWORD:?Error POSTGRES_PASSWORD not set}@db:5432/lex_agent_db

  db:
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=lex_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Error POSTGRES_PASSWORD not set}
      - POSTGRES_DB=lex_agent_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lex_user -d lex_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    profiles: ["test"]
    volumes:
      - type: bind
        source: ./src
        target: /app
    environment:
      - DATABASE_URL=postgresql+asyncpg://lex_user:${POSTGRES_PASSWORD:?Error POSTGRES_PASSWORD not set}@db:5432/lex_agent_db

volumes:
  postgres-data:
