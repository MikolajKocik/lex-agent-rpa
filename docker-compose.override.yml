services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    image: lex-agent-rpa-api:latest
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks:
      - app-network

  tests:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    entrypoint: ["pytest"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
